<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub 通知</title>
  </head>
  <body>
    <div id="frame">
      <!-- 标题栏：拖拽移动 + 窗口控制 -->
      <header id="titlebar" data-tauri-drag-region>
        <span id="title" data-tauri-drag-region>GitHub 通知</span>
        <div class="titlebar-btns">
          <button id="btn-stats" class="tb-btn" title="查看统计">📊</button>
          <button id="btn-settings" class="tb-btn" title="监听管理 / 设置">⚙</button>
          <button id="btn-min" class="tb-btn" title="最小化">—</button>
          <button id="btn-close" class="tb-btn tb-close" title="关闭">×</button>
        </div>
      </header>

      <!-- 主内容区：只有引导页和事件流页，添加/编辑/设置都在管理窗口 -->
      <main id="content">
        <section id="view-guide" class="view">
          <div class="guide-icon fade-up">🔔</div>
          <p class="fade-up delay-1">还没有任何监听对象</p>
          <button id="btn-guide-start" class="btn-primary fade-up delay-2">打开监听管理</button>
        </section>

        <section id="view-list" class="view hidden">
          <p id="poll-error" class="error-text hidden"></p>
          <!-- 分类：未读用红点角标，其余计数与文字同高灰色显示 -->
          <nav id="status-tabs">
            <button class="status-tab active" data-status="unread">未读<span class="tab-dot">0</span></button>
            <button class="status-tab" data-status="read">已读<span class="tab-count">0</span></button>
            <button class="status-tab" data-status="in_progress">处理中<span class="tab-count">0</span></button>
            <button class="status-tab" data-status="done">已解决<span class="tab-count">0</span></button>
          </nav>
          <div id="event-feed">
            <p id="feed-empty" class="hint">暂无新事件。轮询每 60 秒一次，有新动态会自动浮现。</p>
          </div>
          <div id="status-hint" class="fade-up delay-2">
            <span id="hint-text">正在监听 0 个仓库 + 0 个单独条目 · 上次刷新在 --:--:--</span>
            <button id="btn-refresh" class="tb-btn" title="立即刷新">🔄</button>
          </div>
        </section>

        <section id="view-stats" class="view hidden">
          <p class="stats-title">通知统计（跨重启累计）</p>
          <div id="stats-list"></div>
          <button id="btn-stats-back" class="btn-primary">← 返回</button>
        </section>
      </main>

      <!-- 卡片右键菜单：位置由 JS 按光标定位 -->
      <div id="ctx-menu" class="hidden" role="menu"></div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
