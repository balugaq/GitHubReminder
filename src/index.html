<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub 通知</title>
  </head>
  <body>
    <div id="frame">
      <!-- 标题栏：拖拽移动 + 窗口控制 -->
      <header id="titlebar" data-tauri-drag-region>
        <span id="title" data-tauri-drag-region>GitHub 通知</span>
        <div class="titlebar-btns">
          <button id="btn-stats" class="tb-btn" title="查看统计">📊</button>
          <button id="btn-settings" class="tb-btn" title="监听管理 / 设置">⚙</button>
          <button id="btn-min" class="tb-btn" title="最小化">—</button>
          <button id="btn-max" class="tb-btn" title="最大化">□</button>
          <button id="btn-close" class="tb-btn tb-close" title="关闭">×</button>
        </div>
      </header>

      <!-- 主内容区：只有引导页和事件流页，添加/编辑/设置都在管理窗口 -->
      <main id="content">
        <section id="view-guide" class="view">
          <div class="guide-icon fade-up">🔔</div>
          <p class="fade-up delay-1">还没有任何监听对象</p>
          <button id="btn-guide-start" class="btn-primary fade-up delay-2">打开监听管理</button>
        </section>

        <section id="view-list" class="view hidden">
          <!-- 置顶区：右键钉住的通知最多 3 张，横排在最上面 -->
          <div id="pinned-zone"></div>
          <!-- 搜索：标题/作者；@用户名 限定「涉及这个人」，可放在关键词任意位置 -->
          <div class="search-bar">
            <span class="search-icon">🔍</span>
            <input id="search-input" type="text" placeholder="搜索标题 / 作者 · 例：pr title @octocat" autocomplete="off" spellcheck="false" />
            <button id="btn-search-clear" class="search-clear hidden" title="清空搜索">×</button>
          </div>
          <!-- 分类：未读用红点角标，其余计数与文字同高灰色显示 -->
          <nav id="status-tabs">
            <button class="status-tab active" data-status="all"><span class="tab-label"><span class="tab-emoji">📋</span>全部</span><span class="tab-count">0</span></button>
            <button class="status-tab" data-status="unread"><span class="tab-label"><span class="tab-emoji">🔔</span>未读</span><span class="tab-dot">0</span></button>
            <button class="status-tab" data-status="read"><span class="tab-label"><span class="tab-emoji">📖</span>已读</span><span class="tab-count">0</span></button>
            <button class="status-tab" data-status="in_progress"><span class="tab-label"><span class="tab-emoji">⏳</span>处理中</span><span class="tab-count">0</span></button>
            <button class="status-tab" data-status="done"><span class="tab-label"><span class="tab-emoji">✅</span>已解决</span><span class="tab-count">0</span></button>
          </nav>
          <!-- 批量操作条：有选中卡片才出现 -->
          <div id="batch-bar" class="batch-bar hidden">
            <span id="batch-count">已选 0 条</span>
            <select id="batch-status" aria-label="批量标记状态">
              <option value="unread">未读</option>
              <option value="read">已读</option>
              <option value="in_progress">处理中</option>
              <option value="done">已解决</option>
            </select>
            <button id="btn-batch-apply" class="batch-btn" title="批量标记状态">应用</button>
            <button id="btn-batch-clear" class="batch-btn" title="清空选择">×</button>
          </div>
          <!-- 板视图：四列按状态分栏，横向可滚动，卡片可拖到别的列改分类 -->
          <div id="board-wrap" class="hidden">
            <div id="board-columns"></div>
          </div>
          <div id="event-feed">
            <p id="feed-empty" class="hint">暂无新事件。轮询每 60 秒一次，有新动态会自动浮现。</p>
          </div>
          <div id="status-hint" class="fade-up delay-2">
            <span id="hint-text">正在监听 0 个仓库 + 0 个单独条目 · 上次刷新在 --:--:--</span>
            <button id="btn-refresh" class="tb-btn" title="立即刷新">🔄</button>
          </div>
        </section>

        <section id="view-stats" class="view hidden">
          <p class="stats-title">通知统计（跨重启累计）</p>
          <div id="stats-list"></div>
          <button id="btn-stats-back" class="btn-primary">← 返回</button>
        </section>
      </main>

      <!-- 卡片右键菜单：位置由 JS 按光标定位 -->
      <div id="ctx-menu" class="hidden" role="menu"></div>
      <!-- 轻提示：置顶已满 / 复制结果等 -->
      <div id="float-msg" class="hidden"></div>
      <!-- 批量标记完成后的撤销条：从底部向上滑入 -->
      <div id="undo-toast" class="undo-toast" role="status">
        <span id="undo-text">已完成编辑</span>
        <button id="btn-undo" type="button">撤销</button>
      </div>
    </div>
    <script src="search.js"></script>
    <script src="batch.js"></script>
    <script src="board.js"></script>
    <script src="main.js"></script>
  </body>
</html>
